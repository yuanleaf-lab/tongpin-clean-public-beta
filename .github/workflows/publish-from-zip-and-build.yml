name: Publish ZIP to repo and build APK

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: ZIP file name in repository root
        required: true
        default: tongpin-clean-1.3.1-public-full.zip

permissions:
  contents: write

jobs:
  publish-and-build:
    name: Replace repo content, commit, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check uploaded ZIP
        run: |
          set -euo pipefail
          test -f "${{ inputs.zip_name }}"
          echo "ZIP file found."

      - name: Unzip ZIP and replace repository content
        run: |
          set -euo pipefail

          rm -rf /tmp/tongpin-unpack
          mkdir -p /tmp/tongpin-unpack

          unzip -q "${{ inputs.zip_name }}" -d /tmp/tongpin-unpack

          ANDROID_DIR="$(find /tmp/tongpin-unpack -type d -path '*/apps/android' | head -n 1)"
          if [ -z "$ANDROID_DIR" ]; then
            echo "Cannot find apps/android inside ZIP"
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$(dirname "$ANDROID_DIR")")"
          rsync -a --delete "$PROJECT_ROOT"/ ./ \
            --exclude='.git/' \
            --exclude='.github/'

          find . -maxdepth 1 -type f -name '*.zip' -print -delete || true

          test -f README.md
          test -d apps/android
          test -d services/server
          echo "Repository structure validated."

      - name: Block sensitive files and credentials
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' sensitive_files < <(
            find . -path './.git' -prune -o -type f \( \
              -name '.env' -o \( -name '.env.*' ! -name '.env.example' \) -o \
              -name '*.pem' -o -name '*.key' -o -name '*.jks' -o -name '*.keystore' -o \
              -name 'key.properties' -o -name 'signing.properties' -o -name 'local.properties' -o \
              -name 'google-services.json' -o -iname 'credentials*' -o -iname 'secrets*' -o \
              -iname 'service-account*' -o -name 'rooms.json' -o -name 'tongpin-rooms.json' \
            \) -print0
          )
          if (( ${#sensitive_files[@]} > 0 )); then
            echo "Sensitive filename policy failed; refusing to stage the uploaded content."
            exit 1
          fi

          token_pattern='sk-(proj-)?[A-Za-z0-9_-]{12,}|ghp_[A-Za-z0-9_]{12,}|github_pat_[A-Za-z0-9_]{12,}|-----BEGIN (RSA |OPENSSH )?PRIVATE KEY-----'
          token_matches="$(grep -RIlE --exclude-dir=.git --binary-files=without-match "$token_pattern" . || true)"
          if [[ -n "$token_matches" ]]; then
            echo "Potential credential content detected; refusing to stage the uploaded content."
            exit 1
          fi

          database_matches="$(grep -RIl --exclude-dir=.git --exclude='.env.example' --binary-files=without-match 'postgresql://' . || true)"
          if [[ -n "$database_matches" ]]; then
            echo "Database URL detected outside the approved environment template; refusing to stage the uploaded content."
            exit 1
          fi

          if [ -f services/server/.env.example ] && grep -q 'postgresql://' services/server/.env.example; then
            if ! grep -qE '^DATABASE_URL=postgresql://[^:]+:YOUR_[A-Z0-9_]+@YOUR_[A-Z0-9_]+:[0-9]+/[^[:space:]]*$' services/server/.env.example; then
              echo "Environment template database URL is not an approved placeholder; refusing to stage the uploaded content."
              exit 1
            fi
          fi

          echo "Sensitive content check passed."

      - name: Commit replaced public version
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No repository changes to commit."
          else
            git commit -m "Publish Tongpin Clean 1.3.1 public full"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: |
          gradle -p apps/android assembleDebug --no-daemon --console=plain

      - name: Prepare APK artifact
        run: |
          mkdir -p output
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk output/tongpin-clean-1.3.1-public-debug.apk
          ls -lh output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tongpin-clean-1.3.1-public-apk
          path: output/tongpin-clean-1.3.1-public-debug.apk
